plugins {
    id 'com.android.application'
}

// 签名口令只放在 android/keystore.properties（gitignore），构建时读取，绝不写进仓库或日志。
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def hasKeystore = keystorePropsFile.exists()
if (hasKeystore) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'cn.example.aio'
    compileSdk 35

    defaultConfig {
        applicationId 'cn.example.aio'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // 不给 debug 加 applicationIdSuffix：debug/release 同包名，装过 debug 可以直接覆盖升级成 release
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    // 源码里的中文注释/Toast 文案是 UTF-8：Windows 上 javac 默认 GBK 会乱码，显式钉死
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// 唯一的第三方依赖：原生推送要用 WebSocket（Android 没有内置 WS 客户端）。
// OkHttp 4 会带 kotlin-stdlib，但依然不依赖 GMS / androidx 运行期组件。
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
