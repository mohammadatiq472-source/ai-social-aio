# AIO CI —— 每次推送/PR 都在干净机器上重跑「能机器判定的回归」。
#
# 为什么要有这个：以前全部回归靠人记着敲（smoke/accept/mcp-unit），
# 换了窗口就漏；这里把「必须每次都绿」的那些固化成门禁，红了就是真红，不吞退出码。
#
# 覆盖范围（与 docs/维护手册.md §8 一致）：
#   verify job（快，约 1 分钟）：
#     node scripts/mcp-unit.mjs                     169 条（协议桩，零依赖）
#     bash scripts/smoke.sh                          27 条（真服务全流程）
#     node scripts/accept.mjs                        25 条（门控/隔离/幂等）
#     npm run verify:tokens                          样式色值守卫
#     npm run verify:contrast                        对比度守卫（AA）
#     node scripts/verify/verify-pwa.mjs             27 条（静态 + 在线断言）
#     node scripts/verify/verify-read-plan.mjs       39 条（窗口索引 / 命名语句 / 26000 自愈）
#     node scripts/verify/verify-mcp-feed.mjs        AI 发说说（作者/幂等/可见性/日配额）
#     MCP 契约（2026-11-19 补齐，对应外部审查 Q8）——**mcp-unit 只调 handler、不编译 inputSchema**，
#     所以「dm 的 $ref 指向不存在的定义」在 169/169 全绿里完全隐形（Q1 就是这么漏掉的）；
#     下面这几条才真的在守契约，每条失败都会让 job 红（没有 continue-on-error）：
#       verify-mcp-schema.mjs         9 条（ajv 严格编译每个 inputSchema/outputSchema）
#       verify-mcp-modern.mjs        27 条（annotations / structuredContent / resources / prompts）
#       verify-mcp-rate-limit.mjs    16 条（读工具令牌桶 / per-Agent 隔离 / retry_after_ms）
#       verify-mcp-feedback.mjs      13 条（真实客户端反馈：坏编码/自嗨/接力深度/游标别名）
#       verify-mcp-groups.mjs        35 条（群发现 / 加入 / 审批 / 解散）
#       verify-mcp-social.mjs        38 条（好友 / 私聊 / 表情分享 / 退群 / token 吊销）
#       verify-mcp-tools-snapshot.mjs 23 条（tools/list 归一化快照：工具面一漂移就红）
#     其中 modern 与 rate-limit 用 demo@qqmini.dev / buddy@qqmini.dev 登录，
#     而迁移不灌演示数据 → MCP 契约那一段之前先跑 scripts/seed-demo.mjs（见「演示账号」步骤）。
#   ui job（慢，要装两套 chromium，约 8~10 分钟）：
#     10 个 Playwright 脚本 —— 触控热区 / 聊天韧性 / 主人开关 / 前端评审 / 搜索 / 额度 / 通知
#     / 真机安全区（verify-safe-area.py）/ 头像渐变 id 唯一（verify-avatar-gradient.py）
#     / 双端同群同秒达（verify-multi-device.mjs，Node 绑定）。
#     截图写 SHOTS_DIR（CI 里是 ${{ github.workspace }}/tmp/shots-ci），
#     **绝不覆写仓库里已跟踪的 docs/shots**。
#
# 不在这里跑的：需要站务口令的 moderation/admin-ui、只能在生产机上跑的 limits/upload-gate/stream-upload、
# 需要真实推送服务的 push（UI 层已 mock）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 只读仓库内容：CI 不需要写权限
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 回归（协议 / 冒烟 / 验收 / 守卫 / PWA）
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # 与生产/本地同一个大版本（本地实测 psql 16.14）；固定补丁号避免镜像漂移。
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # 迁移用 ADMIN_DATABASE_URL；服务用 DATABASE_URL/WRITER_DATABASE_URL。
      # CI 里都是同一个 postgres 超级用户（和本地 tmp/devstack.sh 同构）：
      # 迁移里的 GRANT 都有 IF EXISTS(pg_roles) 保护，角色不存在时自动跳过。
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aio
      ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aio
      WRITER_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aio
      # 仅 CI 用的固定值：不是生产密钥，也不该被当成密钥用（src/config.mjs 只要求非空）
      SESSION_SECRET: ci-only-session-secret
      SECURE_COOKIE: 'false'
      MEDIA_DIR: ${{ github.workspace }}/tmp/ci-media
      PUBLIC_BASE_URL: http://127.0.0.1:8787
      BASE: http://127.0.0.1:8787

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: 后端依赖
        run: npm ci

      - name: 前端构建
        # verify-pwa 的在线断言要求 8787 真能拿到 manifest/图标 → 必须有 web/dist，
        # 而且这里顺带把 `tsc --noEmit` 的类型检查也跑了（构建脚本就是 tsc + vite build）。
        run: |
          set -euo pipefail
          cd web
          npm ci
          npm run build

      - name: 数据库迁移
        run: |
          set -euo pipefail
          mkdir -p "$MEDIA_DIR"
          node scripts/migrate.mjs

      - name: 起服务并等 /healthz
        run: |
          set -euo pipefail
          node src/index.mjs > /tmp/aio-server.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS "$BASE/healthz" > /dev/null; then
              echo "服务已就绪（约 ${i}s）"
              exit 0
            fi
            sleep 1
          done
          echo "::error::服务 90s 内没有就绪"
          tail -n 50 /tmp/aio-server.log
          exit 1

      - name: 守卫：协议桩 / 样式色值 / 对比度
        run: |
          set -euo pipefail
          node scripts/mcp-unit.mjs
          npm run verify:tokens
          npm run verify:contrast

      - name: PWA 资源（静态 + 在线）
        run: node scripts/verify/verify-pwa.mjs

      - name: 读路径计划（窗口索引 / 命名语句 / 26000 自愈）
        # 需要 DATABASE_URL（本 job 已有）；功能测试看不出执行计划退化，只能靠 EXPLAIN 断言。
        run: node scripts/verify/verify-read-plan.mjs

      - name: 冒烟 + 验收（打真服务）
        run: |
          set -euo pipefail
          bash scripts/smoke.sh
          node scripts/accept.mjs

      - name: AI 发说说（MCP publish_feed：作者/幂等/可见性/日配额）
        run: node scripts/verify/verify-mcp-feed.mjs

      - name: 一键体验配置（compose / Dockerfile / entrypoint；不需要 Docker）
        # 本 job 没有 Docker，所以「docker compose up 能不能跑」在 CI 里只能守配置层：
        # 服务/健康检查/依赖顺序/环境变量/卷/入口脚本顺序/忽略清单/无明文密钥。
        # 运行时的真实验证靠 README 里那条命令 + verify-seed-demo（数据层）。
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check pyyaml
          python scripts/verify/verify-deploy-compose.py

      - name: 演示数据 seed-demo（自建 scratch 库：建群/成员/@与引用/幂等/失败必须响）
        # 2026-11-20 外部评审发现：create_group 加了「只能拉好友」后 seed-demo 建群被拒却打印 ok，
        # 演示账号登录进去一个会话都没有。这条同时守住「数据真的灌进去了」和「失败不再静默」。
        run: node scripts/verify/verify-seed-demo.mjs

      # ---------------------------------------------------------------- MCP 契约（Q8）
      # 为什么单独列成这么多步而不是塞进「守卫」那一步：这 7 条失败原因完全不同
      # （schema 编译 / annotations / 限流 / 客户端反馈 / 群发现 / 社交 / 工具面漂移），
      # 分开跑在 PR 页面上直接看得出是哪一层破了；每步单条命令，非零退出即红。
      #
      # 关于注册：这些脚本自造 t_xxx@test.dev 临时账号。本 job 不设 REGISTER_CODE，
      # 兼容模式下（SIGNUP_MODE 缺省=invite 但没配码）注册是放开的；脚本已把
      # process.env.REGISTER_CODE 透传，将来 CI 真配了码也不用改脚本。

      - name: 演示账号（demo / buddy）
        # 下面 verify-mcp-modern 与 verify-mcp-rate-limit 用 demo@qqmini.dev / buddy@qqmini.dev
        # 登录（固定密码 demo-qqmini-2026），而迁移只建表、不灌演示数据 → 干净库里没有这两个账号。
        # 不种就会走「登录失败 → SKIP」分支，而 SKIP 对契约回归等于没跑。
        #
        # 为什么放在这里而不是「数据库迁移」之后：smoke / accept 现在跑在**没有**演示数据的库上，
        # 先种会把它们的基线从「空库」改成「有演示数据」，那是另一种行为，不该顺手改。
        #
        # 已知（本机实测，不影响上面的用途）：干净库上脚本顺带灌的「AI 圆桌 · 演示」群建不出来
        # —— demo 与 buddy 还不是好友，submit 的 create_group 会被拒，脚本不报错只打 undefined 的
        # conversationId（要修就得先补好友关系，另开一条）。那两个脚本只借 demo/buddy 登录，不受影响。
        run: |
          set -euo pipefail
          node scripts/seed-demo.mjs

      - name: MCP 契约：schema 严格编译（Q1 守卫）
        # mcp-unit 不编译 inputSchema，坏 $ref 在 169/169 全绿里隐形；
        # 这条用 ajv(draft 2020-12) 真编译 20 个工具的 inputSchema/outputSchema，
        # 并断言 required ⊆ properties、所有 $ref 能在自身 schema 内解析。
        run: node scripts/verify/verify-mcp-schema.mjs

      - name: MCP 契约：annotations / structuredContent / resources / prompts
        run: node scripts/verify/verify-mcp-modern.mjs

      - name: MCP 契约：读工具限流（令牌桶 / per-Agent / retry_after_ms）
        # 它自己 spawn 两个临时服务（端口 8793，MCP_RATE_* 调小）做限流断言，不动 8787 那个；
        # 「默认参数 = 120/min burst 20」那条断言要求环境里没有 MCP_RATE_*/MCP_SEARCH_* 覆盖
        # （本 job 没设，保持缺省）。临时服务用同一个 DATABASE_URL/WRITER_DATABASE_URL。
        run: node scripts/verify/verify-mcp-rate-limit.mjs

      - name: MCP 契约：真实客户端反馈的三个问题
        run: node scripts/verify/verify-mcp-feedback.mjs

      - name: MCP 契约：群发现 / 加入 / 审批
        run: node scripts/verify/verify-mcp-groups.mjs

      - name: MCP 契约：好友 / 私聊 / 表情分享 / 退群 / token 吊销
        # 末尾会真的吊销一把 token、真的往 MEDIA_DIR 传一张图（sharp 缩略图），
        # 所以依赖本 job 已有的 MEDIA_DIR 与 npm ci 装好的 sharp。
        run: node scripts/verify/verify-mcp-social.mjs

      - name: MCP 工具面快照（tools/list 归一化 diff）
        # 守的是「AI 客户端读到的工具面」：工具名 / title / 描述 / required / 每个参数的类型 /
        # annotations 四类 / 有没有 outputSchema。谁把 conversation_id 改名、把可选参数改必填、
        # 翻转一个 idempotentHint，这条就红——有意改动必须显式重建快照并一起提交：
        #   node scripts/verify/verify-mcp-tools-snapshot.mjs --update
        run: node scripts/verify/verify-mcp-tools-snapshot.mjs

      - name: 失败时打印服务端日志
        # 只在前面失败时执行，帮助定位「服务起来了但某条断言挂了」
        if: failure()
        run: tail -n 100 /tmp/aio-server.log

  ui:
    # 前端 7 条 Playwright 回归。
    #
    # 为什么单独一个 job：它要装浏览器（--with-deps chromium，约 1~2 分钟），
    # 塞进 verify job 会把「协议/冒烟/验收」的反馈时间拖长一倍；且它的失败原因通常是前端，
    # 分开展示一眼就能看出是哪条挂了。
    #
    # 截图一律写 SHOTS_DIR=$RUNNER_TEMP/shots：仓库里的 docs/shots 是 168 张**已跟踪**产物，
    # CI 若默认写那里，`git status` 会被污染（本地跑也就无法证明“没改仓库”）。
    # 失败时把这一整个目录作为 artifact 上传，下载就能看见挂在哪一屏。
    name: 前端 UI 回归（Playwright 7 条）
    # 固定 ubuntu-24.04：`ubuntu-latest` 在这批 runner 上已经是 26.04，
    # 而 Playwright 1.59 的 chromium 只对 ≤24.04 出包，
    # 装浏览器会直接失败：`ERROR: Playwright does not support chromium on ubuntu26.04-x64`。
    # 等 Playwright 支持 26.04 再考虑回到 ubuntu-latest。
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aio
      ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aio
      WRITER_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aio
      SESSION_SECRET: ci-only-session-secret
      SECURE_COOKIE: 'false'
      MEDIA_DIR: ${{ github.workspace }}/tmp/ci-media
      PUBLIC_BASE_URL: http://127.0.0.1:8787
      BASE: http://127.0.0.1:8787
      # 截图一律写到工作区的 tmp/ 下：仓库里的 docs/shots 是 168 张**已跟踪**产物，CI 不能覆写。
      # 注意：job 级 env 里不能用 runner 上下文（只允许 github/needs/strategy/matrix/vars/secrets/inputs），
      # 所以这里用 github.workspace —— 用 ${{ runner.temp }} 会被 GitHub 判成工作流文件错误（2026-11-15 踩过）。
      SHOTS_DIR: ${{ github.workspace }}/tmp/shots-ci

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 后端依赖
        run: npm ci

      - name: 前端构建
        run: |
          set -euo pipefail
          cd web
          npm ci
          npm run build

      - name: 数据库迁移
        run: |
          set -euo pipefail
          mkdir -p "$MEDIA_DIR" "$SHOTS_DIR"
          node scripts/migrate.mjs

      - name: 生成测试用 VAPID（push-ui 需要「服务端已开启」分支）
        # verify-push-ui 有一条断言叫「服务端已开启时文案正确」：它要求 /api/push/key 能返回公钥，
        # 也就是服务端必须真的配了 VAPID。CI 里临时生成一对写进 $GITHUB_ENV，后面的「起服务」步骤会继承。
        # 这样既不把任何密钥写进仓库，也不需要用 continue-on-error 掩盖。
        run: |
          set -euo pipefail
          KEYS=$(node -e "const w=require('web-push');const k=w.generateVAPIDKeys();process.stdout.write(k.publicKey+' '+k.privateKey)")
          read -r PUB PRIV <<< "$KEYS"
          {
            echo "VAPID_PUBLIC_KEY=$PUB"
            echo "VAPID_PRIVATE_KEY=$PRIV"
            echo "VAPID_SUBJECT=mailto:ci@example.com"
          } >> "$GITHUB_ENV"
          echo "已生成本次运行专用的 VAPID 密钥对（不落仓库）"

      - name: 起服务并等 /healthz
        run: |
          set -euo pipefail
          node src/index.mjs > /tmp/aio-server.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS "$BASE/healthz" > /dev/null; then
              echo "服务已就绪（约 ${i}s）"
              exit 0
            fi
            sleep 1
          done
          echo "::error::服务 90s 内没有就绪"
          tail -n 50 /tmp/aio-server.log
          exit 1

      - name: 装 Playwright（Python 绑定 + chromium）
        # 版本固定，避免浏览器版本漂移导致「本地绿、CI 红」
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check "playwright==1.59.0"
          python -m playwright install --with-deps chromium

      - name: 装 Playwright（Node 绑定 + chromium，给 verify-multi-device.mjs）
        # 两个绑定用的浏览器 build 号不同（Python 1.59=1243 / Node 1.59=1217），所以各装一次。
        # 这一步只多花约 1 分钟，但换来「手机×电脑同群」这条卖点的自动化证据。
        run: npx playwright install --with-deps chromium

      - name: 跑 10 条 UI 回归（聚合：跑完再统一失败）
        # 为什么不用 fail-fast：CI 的价值是「一次看全 Windows 绿 / Linux 红 的差异」。
        # fail-fast 一次只暴露一个脚本，修一个推一次（2026-11-15 首轮就吃了这个亏：
        # 只看到 touch-targets 红，另外 6 个在 Linux 上有没有差异完全不知道）。
        # 这里跑完全部 7 个、逐个打 PASS/FAIL、把汇总写进 SHOTS_DIR 一起进 artifact，
        # 最后用退出码统一失败——**不改任何断言阈值，也不吞失败**。
        run: |
          set -uo pipefail
          fail=0
          summary="$SHOTS_DIR/summary.txt"
          : > "$summary"
          for entry in \
            py:verify-touch-targets \
            py:verify-chat-resilience-ui \
            py:verify-agent-switches-ui \
            py:verify-frontend-review-fixes \
            py:verify-search-ui \
            py:verify-gating-ui \
            py:verify-push-ui \
            py:verify-safe-area \
            py:verify-avatar-gradient \
            node:verify-multi-device
          do
            kind="${entry%%:*}"
            s="${entry#*:}"
            echo "::group::$s"
            if [ "$kind" = "node" ]; then
              if node "scripts/verify/$s.mjs"; then rc=0; else rc=$?; fi
            else
              if python "scripts/verify/$s.py"; then rc=0; else rc=$?; fi
            fi
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              echo "PASS  $s" | tee -a "$summary"
            else
              echo "FAIL  $s  (exit $rc)" | tee -a "$summary"
              fail=1
            fi
          done
          echo "================ UI 回归汇总（落盘：$summary）================"
          cat "$summary"
          echo "=============================================================="
          if [ "$fail" -ne 0 ]; then
            echo "::error::有 UI 脚本失败：看上面的 FAIL 行；截图与 summary 在 ui-shots artifact 里"
          fi
          exit "$fail"

      - name: 失败时上传截图
        # 只有失败才有意义：下载 artifact 能直接看到挂掉那一屏
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots
          path: ${{ github.workspace }}/tmp/shots-ci
          if-no-files-found: warn
          retention-days: 7

      - name: 失败时打印服务端日志
        if: failure()
        run: tail -n 100 /tmp/aio-server.log

  # 3D 世界：独立构建根目录，和 AIO 的 npm 依赖互不相干。
  # 为什么单独一个 job：world/ 有自己的 package-lock 与 tsconfig，混进 verify job 会
  # 把两套依赖装在一起，红了也分不清是谁的问题。
  # 浏览器类验收（verify-physics / verify-scene / verify-futian-*）需要 GPU 或
  # headless 软渲染，跑得慢且数字不可信，默认不进 CI；PR 里要求贴本地结果。
  world:
    name: 3D 世界（类型 + 单测）
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: world/package-lock.json

      - name: 依赖
        run: cd world && npm ci

      - name: 类型检查
        run: cd world && npx tsc --noEmit

      - name: 单测（全量）
        # 文件串行：city.test.ts 在 12k 栋/瓦片场景下单文件 60s+，默认多 worker 会让
        # vitest 的 onTaskUpdate RPC 超时（表现为 3 个 unhandled error + 少跑 64 条），
        # 不是测试失败。串行后 812/812 稳定，约 2 分钟。
        run: cd world && npx vitest run --no-file-parallelism --testTimeout=60000

      - name: 依赖许可（0 copyleft）
        run: cd world && npm run license-check

  # 公开快照内容守卫（2026-11-21 事故后新增）。
  # 背景：公开仓曾因一次普通 `git push` 把完整历史（deploy/AGENTS/交接/服务器 IP）推上去，
  # 6 天后才发现。这个 job 每次 push/PR 都按白名单重建一次快照并扫描，命中就红。
  # 只在开发仓跑（有 docs/public）；公开镜像仓没有该目录，自动跳过。
  public-guard:
    name: 公开快照内容守卫
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 生成并扫描公开白名单
        run: |
          set -euo pipefail
          if [ ! -d docs/public ]; then
            echo "非开发仓（没有 docs/public），跳过"
            exit 0
          fi
          node scripts/build-public-snapshot.mjs
